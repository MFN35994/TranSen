<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#03100b">
  <meta name="description" content="TranSen Aurora — L'infrastructure numérique nationale de transport urbain, interurbain et livraison Yobanté au Sénégal.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="TranSen, TranSen Aurora, Transport, Livraison, Sénégal, Dakar, VTC, Yobanté, Logistique, Allo Dakar, VTC Sénégal">
  <link rel="canonical" href="https://app.transen.org/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TranSen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Fonts TranSen Aurora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <title>TranSen Aurora | Application de Transport & Livraison au Sénégal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 15%, rgba(16, 185, 129, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 85%, rgba(34, 211, 238, 0.12), transparent 50%),
                  #03100b;
      color: #f0fdf7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    #aurora-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
      background: radial-gradient(circle at 50% 42%, rgba(16, 185, 129, 0.2), #03100b 65%);
      transition: opacity 0.45s ease;
    }
    .aurora-orb {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 21, 16, 0.95));
      border: 1.5px solid rgba(52, 211, 153, 0.45);
      box-shadow: 0 0 42px rgba(16, 185, 129, 0.35), inset 0 0 24px rgba(52, 211, 153, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: auroraPulse 2.2s ease-in-out infinite;
    }
    .aurora-orb img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 14px;
    }
    .aurora-brand {
      font-family: 'Sora', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f0fdf7, #34d399, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .aurora-sub {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .aurora-bar {
      width: 150px;
      height: 3px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.15);
      overflow: hidden;
    }
    .aurora-bar-fill {
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #22d3ee, #f5b83d);
      border-radius: 999px;
      animation: auroraSlide 1.3s ease-in-out infinite;
    }
    @keyframes auroraPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 36px rgba(16, 185, 129, 0.32); }
      50% { transform: scale(1.05); box-shadow: 0 0 58px rgba(34, 211, 238, 0.48); }
    }
    @keyframes auroraSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }
  </style>
</head>
<body>
  <div id="aurora-boot-loader">
    <div class="aurora-orb">
      <img src="icons/Icon-192.png" alt="TranSen" onerror="this.style.display='none'">
    </div>
    <div class="aurora-brand">TranSen</div>
    <div class="aurora-sub">Mobilité Souveraine · Sénégal</div>
    <div class="aurora-bar"><div class="aurora-bar-fill"></div></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('aurora-boot-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 460);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function initWebAppTelemetryBeacon() {
      var apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8081'
        : 'https://api.transen.org';
      fetch(apiBase + '/api/system/telemetry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Transen-Platform': 'app.transen.org' },
        body: JSON.stringify({
          featureKey: 'USER_PROFILE_MOBILE',
          platform: 'app.transen.org (Web App)',
          latencyMs: 22,
          isError: false
        })
      })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (data && data.emergencyBanner && String(data.emergencyBanner).trim()) {
          var b = document.createElement('div');
          b.id = 'auroraGlobalEmergencyBanner';
          b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#9f1239,#e11d48,#b45309);color:#fff;padding:7px 16px;font-family:Inter,sans-serif;font-size:12px;font-weight:800;text-align:center;letter-spacing:0.03em;box-shadow:0 6px 20px rgba(244,63,94,0.45);';
          b.textContent = 'ALERTE CENTRE DE COMMANDEMENT TRANSEN : ' + String(data.emergencyBanner).trim();
          document.body.prepend(b);
        }
      })
      .catch(function() {});
    })();
  </script>
</body>
</html>
