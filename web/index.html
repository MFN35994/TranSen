<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TranSen - L'infrastructure et application numérique nationale de transport et de livraison au Sénégal. Connectez-vous, voyagez et expédiez en toute sécurité.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="TranSen, Transport, Livraison, Sénégal, Dakar, VTC, Yobanté, Logistique, Allo Dakar, VTC Sénégal">
  <link rel="canonical" href="https://app.transen.org/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TranSen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TranSen | Application de Transport et Livraison au Sénégal</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw0PKiF8FdoPE26gIP2s1e7XJCozN6rLE"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function initWebAppTelemetryBeacon() {
      var apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8081'
        : 'https://api.transen.org';
      fetch(apiBase + '/api/system/telemetry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Transen-Platform': 'app.transen.org' },
        body: JSON.stringify({
          featureKey: 'USER_PROFILE_MOBILE',
          platform: 'app.transen.org (Web App)',
          latencyMs: 22,
          isError: false
        })
      })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (data && data.emergencyBanner && String(data.emergencyBanner).trim()) {
          var b = document.createElement('div');
          b.id = 'auroraGlobalEmergencyBanner';
          b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#9f1239,#e11d48,#b45309);color:#fff;padding:7px 16px;font-family:sans-serif;font-size:12px;font-weight:800;text-align:center;letter-spacing:0.03em;box-shadow:0 6px 20px rgba(244,63,94,0.45);';
          b.textContent = 'ALERTE CENTRE DE COMMANDEMENT TRANSEN : ' + String(data.emergencyBanner).trim();
          document.body.prepend(b);
        }
      })
      .catch(function() {});
    })();
  </script>
</body>
</html>
